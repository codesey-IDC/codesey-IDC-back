# 코드 품질 도구 설정 (과제 요구사항: PEP 8, 단위 테스트 Coverage 60% 이상)
#   python -m flake8                 PEP 8 검사 (위반 0개 유지)
#   python -m pytest --cov           단위 테스트 + Coverage
#   python -m black -l 99 -S .       자동 정리 (작은따옴표 유지)

[tool:pytest]
testpaths = tests
addopts = -q

[coverage:run]
# dashboard/ 는 패키지(__init__.py)가 아니라 직접 적어야 측정 대상에 들어간다
source =
    .
    dashboard
omit =
    tests/*
    # data 레포(codysey-IDC-data)에서 복사돼 온 일회성 데이터 정제 스크립트 (ASHRAE 원본 탐색용, 서비스와 무관)
    scripts/data_prep/*

[coverage:report]
show_missing = false
skip_empty = true
fail_under = 60

[flake8]
# PEP 8: "팀이 합의하면 한 줄 길이를 99자까지 늘려도 된다" → 99자
max-line-length = 99
# E203, W503: black 과 충돌하는 규칙 (PEP 8 은 이항 연산자 앞에서 줄바꿈을 권장한다)
extend-ignore = E203, W503
exclude = .git, __pycache__, .pytest_cache, .venv, venv
# scripts/ 는 저장소 루트를 sys.path 에 넣은 뒤에 services 를 import 해야 한다
per-file-ignores = scripts/*.py: E402
